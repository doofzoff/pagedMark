name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No stored token. PyPI's trusted publishing exchanges this workflow's OIDC identity for
# a short-lived upload credential, so there is no long-lived secret in the repository to
# leak, rotate or forget. The publisher is configured once on PyPI against this
# repository, this workflow filename and this environment.
permissions:
  contents: read

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # A wheel that ships without its licence and attribution notices is not
      # redistributable, and the check costs nothing.
      - name: Verify the artifacts carry LICENSE and NOTICE
        run: |
          uv run --with twine twine check dist/*
          python - <<'PY'
          import glob, tarfile, zipfile, sys
          sdist = sorted(glob.glob("dist/*.tar.gz"))[-1]
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = tarfile.open(sdist).getnames() + zipfile.ZipFile(wheel).namelist()
          for required in ("LICENSE", "NOTICE"):
              if not any(name.endswith(required) for name in names):
                  sys.exit(f"{required} is missing from the built artifacts")
          print("LICENSE and NOTICE present in both artifacts")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to pypi
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
